<div id="chat-launcher" onclick="toggleChat()" aria-label="Abrir Assistente Labs" title="Abrir Assistente Labs">

    <div class="launcher-icon">
        <img src="{{ url_for('static', filename='img/bot_avatar.png') }}" alt="LabsBot">

</div>

<div id="chat-window">
    <div class="chat-header">
        <div class="header-main">
            <div class="mascot-wrapper">
                <img src="{{ url_for('static', filename='img/bot_avatar.png') }}" alt="Mascote Labs" class="mascot-img">
                <div class="mascot-glow-rgb"></div>
            </div>
            <div class="header-info">
                <h3>LabSuporte</h3>
                <p>Perfil: <span id="user-role-badge">Identificando...</span></p>
            </div>
        </div>
    </div>

    <div id="chat-body" class="chat-body">
        <div class="welcome-container fade-in">
            <div class="welcome-text">
                Olá! 👋 Sou o LabSuporte do MagaBip.
            </div>
        </div>

        <div class="smart-chips-grid" id="smart-chips">
        </div>
    </div>

    <div class="chat-footer">
        <div class="input-island">
            <textarea id="chat-input" rows="1" placeholder="Pergunte algo..." oninput="autoResize(this)"
                onkeydown="handleEnter(event)"></textarea>

            <div class="input-controls">
                <button id="voice-btn" class="control-btn voice-trigger" title="Comando de Voz">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button id="send-btn" class="control-btn send-trigger" onclick="sendMessage()" title="Enviar">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <div class="footer-copyright">LuizaLabs &copy; 2026</div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/voice_commands.js') }}"></script>
<script>
    // Chatbot Widget JS
    const form = document.getElementById('chatbot-form');
    const input = document.getElementById('chatbot-input');
    const messages = document.getElementById('chatbot-messages');
    const voiceBtn = document.getElementById('voice-btn');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        addMessage('Você', question);
        input.value = '';
        // Chama API do chatbot
        const resp = await fetch('/api/chatbot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });
        const data = await resp.json();
        addMessage('Bot', data.answer);
    });
    function addMessage(sender, text) {
        const msg = document.createElement('div');
        msg.innerHTML = `<b>${sender}:</b> ${text}`;
        msg.style.marginBottom = '8px';
        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
    }
    // Comando de voz
    voiceBtn.onclick = function () {
        if (window.startVoiceRecognition) window.startVoiceRecognition(input);
    };

    function toggleChat() {
        const win = document.getElementById('chat-window');
        if (win.style.display === 'flex') {
            win.style.display = 'none';
        } else {
            win.style.display = 'flex';
            // Foco no input ao abrir
            setTimeout(() => {
                const input = document.getElementById('chat-input');
                if (input) input.focus();
            }, 200);
        }
    }
    // Fecha o chat ao clicar fora da janela
    window.addEventListener('mousedown', function (e) {
        const win = document.getElementById('chat-window');
        const launcher = document.getElementById('chat-launcher');
        if (win.style.display === 'flex' && !win.contains(e.target) && !launcher.contains(e.target)) {
            win.style.display = 'none';
        }
    });
</script>

<script>
    const ROLE = "{{ current_user.role|lower }}";

    document.addEventListener('DOMContentLoaded', () => {
        setupBotInterface();
    });

    function setupBotInterface() {
        const badge = document.getElementById('user-role-badge');
        const chipsContainer = document.getElementById('smart-chips');
        badge.innerText = ROLE.toUpperCase();

        let chips = [];
        if (ROLE === 'ti') {
            chips = ['📊 Status Servidor', '🛠️ Logs de Erro', '🔑 Reset Full', '🛰️ Debug Rede'];
        } else if (ROLE === 'lider' || ROLE === 'liderança') {
            chips = ['📂 Consulta Ticket', '🔗 Link Zendesk', '🔗 Link Túria', '📄 Relatórios (IA)'];
        } else {
            chips = ['📱 Coletor Travou', '🖨️ Etiqueta Torta', '🔌 Sem Energia', '🔋 Trocar Bateria'];
        }

        chipsContainer.innerHTML = chips.map(c => `
            <button class="tech-chip ${c.includes('(IA)') ? 'ia-special' : ''}" onclick="sendQuickMsg('${c}')">
                ${c}
            </button>
        `).join('');
    }

    function toggleChat() {
        const win = document.getElementById('chat-window');
        if (win.style.display === 'flex') {
            win.style.display = 'none';
        } else {
            win.style.display = 'flex';
            // Foco no input ao abrir
            setTimeout(() => {
                const input = document.getElementById('chat-input');
                if (input) input.focus();
            }, 200);
        }
    }
    // Fecha o chat ao clicar fora da janela
    window.addEventListener('mousedown', function (e) {
        const win = document.getElementById('chat-window');
        const launcher = document.getElementById('chat-launcher');
        if (win.style.display === 'flex' && !win.contains(e.target) && !launcher.contains(e.target)) {
            win.style.display = 'none';
        }
    });

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        appendMsg(text, 'user');
        input.value = ""; autoResize(input);
        try {
            const resp = await fetch('/api/chatbot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, role: ROLE })
            });
            const data = await resp.json();
            appendMsg(data.response, 'bot');
        } catch (e) { appendMsg("Erro na comunicação com a IA.", 'bot'); }
    }

    function appendMsg(text, sender) {
        const body = document.getElementById('chat-body');
        const div = document.createElement('div');
        div.style.padding = "8px";
        div.style.marginBottom = "5px";
        div.style.borderRadius = "10px";
        div.style.background = sender === 'user' ? '#e0f2fe' : '#f1f5f9';
        div.style.alignSelf = sender === 'user' ? 'flex-end' : 'flex-start';
        div.innerHTML = `<div style="font-size: 0.9rem;">${text}</div>`;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    function sendQuickMsg(msg) {
        document.getElementById('chat-input').value = msg;
        sendMessage();
    }
</script>
